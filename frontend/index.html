<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CertiFlow — Pragati Skills Mission</title>
    <meta name="description" content="CertiFlow skilling certificate issuance, batch approval, and verification portal for Pragati Skills Mission." />
    <meta property="og:title" content="CertiFlow — Pragati Skills Mission" />
    <meta property="og:description" content="Enterprise skilling certificate issuance, multi-level approval, and public verification platform." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('certiflow_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#F6F5F0] text-slate-900 dark:bg-[#0D1016] dark:text-slate-100 antialiased selection:bg-[#0F294D] selection:text-white">

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
